<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홍이 · 아바타 모션 조건</title>
<style>
  :root{
    --bg: #eef0f6;
    --phone-bg: #ffffff;
    --bubble-bot: #f1f1f5;
    --bubble-user: #7c6cf0;
    --text-dark: #26252b;
    --text-mid: #6f6d7a;
    --text-faint: #a9a7b3;
    --accent: #7c6cf0;
    --accent-soft: #ece9fd;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    font-family: "Apple SD Gothic Neo","Pretendard","Malgun Gothic",-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dark);
  }
  .stage{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding: 24px 12px;
  }
  .tag{
    font-size:12px; letter-spacing:.02em; color:var(--text-mid);
    background:#fff; border:1px solid #e3e1ee; padding:5px 12px; border-radius:999px;
  }
  .tag b{ color:var(--accent); font-weight:700; }

  .phone{
    width:340px; height:700px;
    background: var(--phone-bg);
    border-radius: 42px;
    border: 8px solid #1c1c1e;
    box-shadow: 0 20px 50px rgba(20,15,50,0.18);
    overflow:hidden;
    display:flex; flex-direction:column;
    position:relative;
  }
  .statusbar{
    height:34px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding: 6px 20px 0 22px;
    font-size:13px; font-weight:600; color:var(--text-dark);
  }
  .statusbar .icons{ display:flex; gap:5px; align-items:center; opacity:.75; font-size:11px;}

  .chatheader{
    flex:0 0 auto;
    display:flex; align-items:center; gap:10px;
    padding: 6px 16px 12px 16px;
    border-bottom: 1px solid #efeef4;
  }
  .avatar-circle{
    width:36px; height:36px; border-radius:50%;
    background: var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; flex:0 0 auto; overflow:hidden;
  }
  .avatar-circle img{ width:100%; height:100%; object-fit:cover; display:block; }
  .chatheader .who{ line-height:1.25; }
  .chatheader .who .name{ font-size:14px; font-weight:700; }
  .chatheader .who .sub{ font-size:11px; color:var(--text-mid); }
  .chatheader .dots{ margin-left:auto; color:var(--text-faint); font-weight:700; letter-spacing:2px; }

  .chatbody{
    flex:1 1 auto; overflow-y:auto;
    padding: 14px 14px 10px 14px;
    display:flex; flex-direction:column; gap:10px;
    background: #fbfbfd;
  }
  .row{ display:flex; width:100%; }
  .row.bot{ justify-content:flex-start; }
  .row.user{ justify-content:flex-end; }
  .row.system{ justify-content:flex-start; }

  .bubble{
    max-width: 76%;
    padding: 10px 13px;
    font-size:13.5px; line-height:1.5;
    border-radius: 16px;
    white-space:pre-line;
  }
  .bubble.bot{
    background: var(--bubble-bot);
    color: var(--text-dark);
    border-bottom-left-radius: 5px;
  }
  .bubble.user{
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 5px;
  }

  /* --- typing indicators --- */
  .bubble.indicator{
    background: var(--bubble-bot);
    color: var(--text-mid);
    border-bottom-left-radius:5px;
    display:flex; align-items:center; gap:7px;
    font-size:12.5px;
  }
  .spinner{
    width:13px; height:13px; border-radius:50%;
    border: 2px solid #d8d6e4; border-top-color: var(--accent);
    animation: spin .8s linear infinite;
    flex:0 0 auto;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .dots-indicator{ display:flex; gap:4px; align-items:center; height:8px; }
  .dots-indicator span{
    width:6px; height:6px; border-radius:50%;
    background: var(--text-faint);
    animation: dot-bounce 1.1s infinite ease-in-out;
  }
  .dots-indicator span:nth-child(2){ animation-delay:.15s; }
  .dots-indicator span:nth-child(3){ animation-delay:.3s; }
  @keyframes dot-bounce{
    0%,60%,100%{ transform: translateY(0); opacity:.55; }
    30%{ transform: translateY(-4px); opacity:1; }
  }

  .avatar-indicator-wrap{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding: 6px 4px 2px;
  }
  .avatar-face{
    position:relative;
    width:78px; height:78px; border-radius:18px;
    overflow:hidden;
  }
  .avatar-face .layer{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .avatar-face .layer-head{
    animation: gentleNodHead 2.4s ease-in-out infinite;
  }
  .avatar-face .layer-mouth{
    position:absolute;
    left:26.25%; top:53.33%;
    width:24.58%; height:15%;
    object-fit: fill;
    animation: gentleNodHead 2.4s ease-in-out infinite;
  }
  @keyframes gentleNodHead{
    0%, 18%   { transform: translateY(0); }
    9%        { transform: translateY(4px); }
    27%, 45%  { transform: translateY(0); }
    36%       { transform: translateY(4px); }
    100%      { transform: translateY(0); }
  }
  .avatar-indicator-wrap .caption{ font-size:11px; color:var(--text-faint); }

  .system-status{
    font-size:12.5px; color: var(--text-faint);
    padding: 4px 13px;
  }

  /* --- options --- */
  .options{
    flex:0 0 auto;
    display:flex; flex-direction:column; gap:8px;
    padding: 8px 14px 4px 14px;
    background:#fbfbfd;
  }
  .options{ max-height:340px; overflow-y:auto; }
  .options .option-btn{ flex:0 0 auto; }
  .option-btn{
    text-align:left;
    border:1.5px solid var(--accent);
    background:#fff;
    color: var(--accent);
    font-size:13px;
    padding: 10px 13px;
    border-radius: 14px;
    cursor:pointer;
    transition: background .15s ease, transform .1s ease;
    font-family:inherit;
  }
  .option-btn:hover{ background: var(--accent-soft); }
  .option-btn:active{ transform: scale(0.98); }

  .end-note{
    text-align:center; font-size:11.5px; color:var(--text-faint);
    padding: 6px 0 2px;
  }

  .inputbar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding: 10px 12px 16px 12px;
    background: #fff;
    border-top: 1px solid #efeef4;
  }
  .inputbar .field{
    flex:1 1 auto;
    background:#f1f1f5;
    border-radius: 999px;
    padding: 10px 15px;
    font-size:13px;
    color: var(--text-faint);
  }
  .inputbar .field.active-status{ color: var(--text-mid); }
  .inputbar.ended .field{ color: var(--text-faint); font-style: italic; }
  .inputbar.ended .sendbtn{ opacity:.35; pointer-events:none; }
  .sendbtn{
    width:34px; height:34px; border-radius:50%;
    background: var(--accent-soft); color: var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto; font-size:14px;
  }

  .caption-block{
    max-width:340px; text-align:center;
  }
  .caption-block h1{ font-size:15px; margin:0 0 4px; }
  .caption-block p{ font-size:12px; color:var(--text-mid); margin:0; line-height:1.5; }
  .export-link{
    margin-top:10px;
    font-family:inherit;
    font-size:11.5px;
    color: var(--accent);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }
</style>
</head>

// Google Apps Script 웹 앱 URL을 여기에 붙여넣으면 각 선택이 구글 시트로 자동 기록됩니다.
// 비워두면(기본값) 원격 전송 없이 이 브라우저의 localStorage에만 기록됩니다.
const SHEET_WEBHOOK_URL = "";

function getSessionId(){
  let id = localStorage.getItem('comfort_bot_session_id');
  if(!id){
    id = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'sid_' + Math.random().toString(36).slice(2) + Date.now();
    localStorage.setItem('comfort_bot_session_id', id);
  }
  return id;
}

function logEvent(step, selectedLabel){
  const payload = {
    condition: CONDITION,
    session_id: getSessionId(),
    step: step,
    selected_label: selectedLabel,
    timestamp: new Date().toISOString(),
  };

  // 로컬 백업 로그 (웹훅 설정 여부와 무관하게 항상 기록됨)
  try{
    const key = 'comfort_bot_log';
    const prev = JSON.parse(localStorage.getItem(key) || '[]');
    prev.push(payload);
    localStorage.setItem(key, JSON.stringify(prev));
  }catch(err){ /* localStorage 사용 불가 시 무시 */ }

  if(!SHEET_WEBHOOK_URL) return;
  fetch(SHEET_WEBHOOK_URL, {
    method: 'POST',
    mode: 'no-cors', // Apps Script 응답을 읽지 않는 단방향 전송
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload),
  }).catch(() => { /* 네트워크 실패 시 무시하고 로컬 로그는 유지 */ });
}

// ---------- rendering helpers ----------
function scrollToBottom(){
  chatBody.scrollTop = chatBody.scrollHeight;
}

function addBotBubble(text){
  const row = document.createElement('div');
  row.className = 'row bot';
  const b = document.createElement('div');
  b.className = 'bubble bot';
  b.textContent = text;
  row.appendChild(b);
  chatBody.appendChild(row);
  scrollToBottom();
}

function addUserBubble(text){
  const row = document.createElement('div');
  row.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bubble user';
  b.textContent = text;
  row.appendChild(b);
  chatBody.appendChild(row);
  scrollToBottom();
}

function clearOptions(){
  optionsArea.innerHTML = '';
}

function renderOptions(options){
  clearOptions();
  if(!options){
    const note = document.createElement('div');
    note.className = 'end-note';
    note.textContent = `대화가 종료되었습니다 (총 ${turnCount}번의 선택 완료) · 새로고침하면 다시 시작할 수 있어요`;
    optionsArea.appendChild(note);
    const bar = document.querySelector('.inputbar');
    if(bar){
      bar.classList.add('ended');
      inputField.textContent = '대화가 종료되었습니다';
    }
    return;
  }
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.label;
    btn.onclick = () => handleSelect(opt);
    optionsArea.appendChild(btn);
  });
}

let blinkInterval = null;

function startAvatarBlink(){
  stopAvatarBlink();
  const blink = () => {
    const img = document.getElementById('avatarMotionImg');
    if(!img) return;
    img.src = AVATAR_HEAD_CLOSED;
    setTimeout(() => { if(img) img.src = AVATAR_HEAD_OPEN; }, 180);
  };
  // first blink fires quickly so it's visible even in a short window,
  // then repeats at a natural pace
  setTimeout(blink, 450);
  blinkInterval = setInterval(blink, 1400);
}

function stopAvatarBlink(){
  if(blinkInterval){
    clearInterval(blinkInterval);
    blinkInterval = null;
  }
}

let mouthTimeout = null;

function mouthCycle(showO){
  const img = document.getElementById('avatarMouthImg');
  if(!img) return;
  img.src = showO ? MOUTH_O : MOUTH_DEFAULT;
  mouthTimeout = setTimeout(() => mouthCycle(!showO), showO ? 480 : 780);
}

function startMouthMove(){
  stopMouthMove();
  mouthCycle(false); // 가만히 있는 기본 입 모양에서 시작
}

function stopMouthMove(){
  if(mouthTimeout){
    clearTimeout(mouthTimeout);
    mouthTimeout = null;
  }
}

// ---------- flow control ----------
let currentStep = 'start';
let turnCount = 0; // 사용자가 보기를 선택한 횟수

function goTo(nodeKey, replyText){
  const node = script[nodeKey];
  clearOptions();
  showIndicator();
  const delay = CONDITION === 'avatar'
    ? 2400 + Math.random()*400   // give enough time to see nodding + blinking
    : 1300 + Math.random()*500;
  setTimeout(() => {
    hideIndicator();
    addBotBubble(replyText ? replyText + "\n\n" + node.bot : node.bot);
    const forceEnd = turnCount >= MAX_TURNS; // MAX_TURNS번 선택했으면 대화 종료
    renderOptions(forceEnd ? null : node.options);
    currentStep = nodeKey;
    if(forceEnd || !node.options){
      logEvent(nodeKey, null); // 대화 종료 지점 기록
    }
  }, delay);
}

function handleSelect(opt){
  logEvent(currentStep, opt.label); // 사용자가 고른 보기 기록
  turnCount++;
  addUserBubble(opt.label);
  clearOptions();
  goTo(opt.next, opt.reply);
}

// ---------- init ----------
window.addEventListener('DOMContentLoaded', () => {
  addBotBubble(script.start.bot);
  renderOptions(script.start.options);

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn){
    exportBtn.addEventListener('click', () => {
      const log = JSON.parse(localStorage.getItem('comfort_bot_log') || '[]');
      if(log.length === 0){
        alert('아직 기록된 선택이 없어요. 대화를 진행한 뒤 다시 시도해주세요.');
        return;
      }
      const headers = ['timestamp','condition','session_id','step','selected_label'];
      const rows = log.map(r => headers.map(h => {
        const v = r[h] == null ? '' : String(r[h]).replace(/"/g, '""');
        return `"${v}"`;
      }).join(','));
      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `comfort_bot_log_${CONDITION}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });
  }
});
</script>
